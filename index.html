<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fang League</title>
<meta name="theme-color" content="#101b18">
<script src="src/theme.js"></script>
<style>
  :root {
    --ink: #140e0c;
    --mud: #1c1410;
    --panel: #2a1d16;
    --panel-2: #3a291e;
    --line: #1a120e;
    --cream: #f4e6cf;
    --dim: #cbb89a;
    --gold: #f0c14a;
    --ember: #e25c1a;
    --good: #8fd16a;
    --bad: #e15d5d;
    --shadow: #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--mud);
    color: var(--cream);
    font-family: "Courier New", Courier, monospace;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 4px 4px;
  }
  .wrap { width: min(980px, calc(100% - 20px)); margin: 0 auto; padding: 14px 0 32px; position: relative; }
  header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--gold); text-shadow: 3px 3px 0 #000; }
  .tag { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  #hud {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    margin: 12px 0; padding: 8px 10px;
    background: #120d0b; border: 3px solid #000;
  }
  .stat { display: flex; align-items: center; gap: 6px; min-height: 32px; font-size: 15px; }
  .stat img, .fallback-icon { width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .fallback-icon { display: inline-block; }
  .spacer { flex: 1; min-width: 8px; }
  button, .tab {
    font-family: inherit; font-weight: 700; font-size: 14px;
    color: var(--ink); background: var(--gold);
    border: 3px solid #000; box-shadow: 3px 3px 0 #000;
    padding: 7px 10px; cursor: pointer;
  }
  button:hover:not(:disabled), .tab:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #000; }
  button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; transform: none; }
  button.ghost, .tab { background: var(--panel-2); color: var(--cream); }
  button.card {
    color: #fff6e4;
    background: var(--panel);
    text-align: left;
    text-shadow: 0 1px 0 #000, 1px 0 0 #000, 0 -1px 0 #140e0c;
  }
  button.card h2 { color: #fffaf0; font-size: 16px; margin: 0 0 4px; text-shadow: 0 2px 0 #000, 1px 1px 0 #000; }
  button.card .style { color: #ffe08a; }
  button.card .muted { color: #f0e0c8; }
  .why { color: #fff6e4; font-size: 12px; background: #3a2218; border: 2px solid #000; padding: 4px 6px; }
  #speed[hidden], #pause[hidden] { display: none; }
  button.ember { background: var(--ember); color: white; }
  button.danger { background: #8d2f2f; color: white; }
  .tab.on { background: var(--ember); color: white; }
  #flash { min-height: 1.2em; margin: 0 0 8px; color: var(--gold); font-size: 14px; }
  #view { min-height: 320px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card, .panel {
    background: var(--panel); border: 3px solid #000; padding: 10px;
    box-shadow: 4px 4px 0 #000;
  }
  .card.on { outline: 3px solid var(--gold); }
  .card h2, .panel h2 { margin: 0 0 6px; font-size: 16px; }
  .style { color: var(--gold); margin: 0 0 6px; }
  .muted { color: var(--dim); font-size: 13px; line-height: 1.4; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .who { display: flex; gap: 8px; align-items: center; }
  canvas.crest, canvas.portrait, canvas.face { background: #140e0c; border: 2px solid #000; }
  .swatch { display: inline-block; width: 12px; height: 12px; border: 2px solid #000; vertical-align: -1px; }
  .hero { display: flex; gap: 14px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  #missing {
    position: fixed; right: 12px; bottom: 12px; z-index: 6; width: min(420px, calc(100% - 24px));
    max-height: 50vh; overflow: auto; background: #241910; color: #f4e6cf;
    border: 3px solid #000; box-shadow: 4px 4px 0 #000; padding: 10px;
  }
  #missing[hidden] { display: none; }
  #missing ul { margin: 8px 0 0; padding-left: 18px; font-size: 12px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; margin: 6px 0; font-size: 13px; }
  .bar { height: 8px; background: #140e0c; border: 2px solid #000; }
  .bar > span { display: block; height: 100%; background: var(--gold); }
  .badge { display: inline-block; background: var(--ember); color: white; padding: 1px 5px; font-size: 11px; border: 2px solid #000; }
  .badge.out { background: var(--bad); }
  .badge.fit { background: #2f6b3a; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 2px solid #140e0c; }
  tr.me { background: #4a3018; }
  tr.spot td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
  .match-layout { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #pitch {
    width: min(800px, 100%); height: auto; background: #203018;
    border: 4px solid #000; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: manipulation;
  }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .end { text-align: center; padding: 18px 10px; }
  .end h2 { font-size: 32px; margin: 8px 0; color: var(--gold); text-shadow: 3px 3px 0 #000; }
  footer.danger {
    margin-top: 36px; padding-top: 14px;
    border-top: 3px dashed #4a3428;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  footer.danger p { margin: 0; color: var(--dim); max-width: 460px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: grid; place-items: center; z-index: 5; padding: 16px; }
  .modal[hidden] { display: none; }
  .modal-card { max-width: 440px; }
  #boot-error { background: #8d2f2f; color: white; padding: 10px; border: 3px solid #000; }
  @media (max-width: 720px) {
    h1 { font-size: 22px; }
    .split { grid-template-columns: 1fr; }
    .stat { font-size: 13px; }
  }
</style>
<link rel="stylesheet" href="src/club.css">
<link rel="stylesheet" href="src/theme.css">
<meta name="description" content="Build a fantasy football club. Recruit misfits, train stars, grow your ground and fight for the Fang League cup.">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>FANG LEAGUE</h1>
      <p class="tag">Little club. Big hits. Legendary seasons.</p>
    </div>
    <div class="header-actions"><span class="edition">CLUB MANAGER · DEVELOPMENT EDITION</span><button type="button" class="ghost" id="theme-toggle" aria-label="Switch to light mode">☀ Light mode</button><button class="ember" data-act="open-exhibition">Watch an exhibition →</button></div>
  </header>
  <div id="hud" aria-label="Season status">
    <div class="stat" id="hud-gold"></div>
    <div class="stat" id="hud-fans"></div>
    <div class="stat" id="hud-match"></div>
    <div class="stat" id="hud-rank"></div>
    <span class="spacer"></span>
    <button type="button" id="speed">Speed 1×</button>
    <button type="button" id="pause">Pause</button>
  </div>
  <p id="flash" role="status"></p>
  <p id="boot-error" hidden></p>
  <main id="view"></main>
  <footer class="danger">
    <button type="button" class="danger" id="restart">Restart</button>
    <button type="button" class="ghost" id="missing-btn" aria-controls="missing" aria-expanded="false" hidden>Missing art</button>
    <p id="save-status" role="status">Your club starts here</p>
  </footer>
  <aside id="missing" hidden>
    <h2>Artwork could not load</h2>
    <p id="missing-count" class="muted" role="status"></p>
    <ul id="missing-list"></ul>
  </aside>
</div>
<div id="modal" class="modal" hidden>
  <div class="modal-card panel" role="dialog" aria-modal="true" aria-labelledby="restart-title">
    <h2 id="restart-title">Restart the league?</h2>
    <p>This throws out your squad, gold, fans, and season, and sets speed back to 1×.</p>
    <div class="row">
      <button type="button" class="danger" id="modal-yes">Restart</button>
      <button type="button" class="ghost" id="modal-no">Keep playing</button>
    </div>
  </div>
</div>
<script>
  window.addEventListener('error', (event) => {
    const el = document.getElementById('boot-error');
    if (!el) return;
    el.hidden = false;
    el.textContent = 'The game failed to start. If this file was opened directly, serve the folder instead (see the README). ' + (event.message || '');
  });
</script>
<script type="module" src="src/game.js"></script>
</body>
</html>
